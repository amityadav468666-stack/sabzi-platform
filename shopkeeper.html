<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दुकानदार Dashboard</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><a class="logo" href="index.html">🥬 SabziGo</a></header><main>
<h1>🏪 दुकानदार Dashboard</h1><section class="card"><h2>दुकान</h2><form id="shopForm"><input id="shopName" placeholder="दुकान का नाम" required><input id="shopAddress" placeholder="दुकान का पता" required><button class="btn">दुकान सेव करें</button></form></section>
<section class="card"><h2>सब्ज़ी जोड़ें</h2><form id="productForm"><input id="pName" placeholder="नाम" required><input id="pPrice" type="number" placeholder="कीमत ₹/kg" required><input id="pStock" type="number" placeholder="Stock kg" required><input id="pImage" placeholder="Image URL (optional)"><button class="btn">Product जोड़ें</button></form></section>
<div id="myProducts" class="grid"></div><p id="msg"></p></main><script type="module" src="js/shopkeeper.js"></script></body></html>
