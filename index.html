<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SabziGo — Real Online Sabzi Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#1d1d1d}
header{background:#16803c;color:#fff;padding:14px;position:sticky;top:0;z-index:20}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:24px;font-weight:700}
main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.product{border:1px solid #ddd;border-radius:10px;padding:14px}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#16803c;color:#fff}.secondary{background:#eee;color:#222}.danger{background:#b42318}.hidden{display:none!important}
.price{font-weight:700;color:#16803c}.row{display:flex;gap:8px;flex-wrap:wrap}.msg{padding:10px;border-radius:8px;margin:10px 0}.ok{background:#e8f7ec;color:#176b31}.bad{background:#ffe9e9;color:#a00}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:50}.modalbox{background:#fff;padding:20px;border-radius:12px;width:min(430px,100%)}
small{color:#666}footer{text-align:center;background:#16803c;color:#fff;padding:20px;margin-top:30px}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">🥬 SabziGo</div><div class="row"><button id="authButton">Login / Signup</button><button id="cartButton">🛒 Cart <span id="cartCount">0</span></button></div></div></header>

<main>
<div id="notice"></div>

<section class="card">
<h1>ताज़ी सब्ज़ियाँ ऑनलाइन</h1>
<p>Firebase Firestore में मौजूद असली shops और products यहाँ दिखेंगे।</p>
<input id="search" placeholder="सब्ज़ी या दुकान खोजें">
</section>

<section id="customerView"><div id="catalog" class="grid"></div></section>

<section id="shopkeeperView" class="hidden">
<div class="card"><h2>🏪 Shopkeeper Dashboard</h2><p id="ownerEmail"></p></div>
<div class="card">
<h3>मेरी Shop</h3>
<input id="shopName" placeholder="Shop का नाम">
<input id="shopAddress" placeholder="Shop का पता">
<button id="saveShop">Shop Save करें</button>
</div>
<div class="card">
<h3>Product जोड़ें</h3>
<input id="pName" placeholder="Product name">
<input id="pPrice" type="number" min="0" placeholder="Price ₹/kg">
<input id="pStock" type="number" min="0" placeholder="Stock">
<button id="addProduct">Product Add करें</button>
</div>
<div class="card"><h3>मेरे Products</h3><div id="myProducts" class="grid"></div></div>
</section>

<section id="adminView" class="hidden">
<div class="card"><h2>👨‍💼 Admin Dashboard</h2><div id="adminStats"></div></div>
</section>
</main>

<div id="authModal" class="modal hidden"><div class="modalbox">
<h2 id="authTitle">Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<select id="role"><option>Customer</option><option>Shopkeeper</option></select>
<div class="row"><button id="authSubmit">Login</button><button class="secondary" id="switchAuth">Signup</button><button class="secondary" id="closeAuth">Close</button></div>
<p id="authError"></p>
</div></div>

<div id="cartModal" class="modal hidden"><div class="modalbox">
<h2>🛒 Cart</h2><div id="cartItems"></div>
<button id="placeOrder">Order Place करें</button> <button class="secondary" id="closeCart">Close</button>
</div></div>

<footer>© 2026 SabziGo — Real Firebase-powered platform</footer>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDBnHhIu-BU10YVrqWaitMTE6ZDArp_xhI",
authDomain:"sabzigo-2a2dc.firebaseapp.com",
projectId:"sabzigo-2a2dc",
storageBucket:"sabzigo-2a2dc.firebasestorage.app",
messagingSenderId:"395661220461",
appId:"1:395661220461:web:cacc5b82055eb35cb43d64",
measurementId:"G-PXR1S16SJC"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,profile=null,shop=null,allProducts=[],cart=[],signup=false;

const $=id=>document.getElementById(id);
const say=(t,ok=false)=>{$("notice").innerHTML='<div class="msg '+(ok?"ok":"bad")+'">'+t+'</div>';setTimeout(()=>$("notice").innerHTML="",3500)};
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));

$("authButton").onclick=()=>{if(user)signOut(auth);else $("authModal").classList.remove("hidden")};
$("closeAuth").onclick=()=>$("authModal").classList.add("hidden");
$("closeCart").onclick=()=>$("cartModal").classList.add("hidden");
$("cartButton").onclick=()=>{$("cartModal").classList.remove("hidden");renderCart()};
$("switchAuth").onclick=()=>{signup=!signup;$("authTitle").textContent=signup?"Signup":"Login";$("authSubmit").textContent=signup?"Account बनाएं":"Login";$("switchAuth").textContent=signup?"Login":"Signup"};

$("authSubmit").onclick=async()=>{
try{const email=$("email").value.trim(),password=$("password").value,role=$("role").value;
if(password.length<6)throw Error("Password कम से कम 6 characters का रखें।");
if(signup){
const c=await createUserWithEmailAndPassword(auth,email,password);
await setDoc(doc(db,"users",c.user.uid),{email,role,name:email.split("@")[0],createdAt:serverTimestamp()});
}else await signInWithEmailAndPassword(auth,email,password);
$("authModal").classList.add("hidden");say(signup?"Account बन गया।":"Login सफल हुआ।",true);
}catch(e){$("authError").textContent=e.message}
};

async function profileLoad(){
const s=await getDoc(doc(db,"users",user.uid));
profile=s.exists()?s.data():{role:"Customer"};
$("authButton").textContent="Logout";
$("customerView").classList.toggle("hidden",profile.role!=="Customer");
$("shopkeeperView").classList.toggle("hidden",profile.role!=="Shopkeeper");
$("adminView").classList.toggle("hidden",profile.role!=="Admin");
if(profile.role==="Shopkeeper")await shopkeeperLoad();
else if(profile.role==="Admin")await adminLoad();
else await catalogLoad();
}

async function catalogLoad(){
allProducts=[];
const users=await getDocs(collection(db,"users"));
for(const u of users.docs){
const shops=await getDocs(collection(db,"users",u.id,"shops"));
for(const s of shops.docs){
const sd=s.data();
const ps=await getDocs(collection(db,"users",u.id,"shops",s.id,"products"));
ps.forEach(p=>allProducts.push({id:p.id,uid:u.id,shopId:s.id,shopName:sd.name||"Shop",...p.data()}));
}}
renderCatalog(allProducts);
}

function renderCatalog(list){
$("catalog").innerHTML="";
if(!list.length){
$("catalog").innerHTML='<div class="card">अभी कोई product उपलब्ध नहीं है।</div>';
return
}
list.forEach(p=>{
const d=document.createElement("div");
d.className="product";
d.innerHTML='<h3>🥬 '+esc(p.name)+'</h3><p>'+esc(p.shopName)+'</p><p class="price">₹'+Number(p.price||0)+' / kg</p><p>Stock: '+Number(p.stock||0)+'</p><br><button>🛒 Cart में जोड़ें</button>';
d.querySelector("button").onclick=()=>addCart(p);
$("catalog").appendChild(d);
});
}

function addCart(p){
if(Number(p.stock||0)<=0)return say("यह product अभी stock में नहीं है।");
const x=cart.find(a=>a.id===p.id&&a.uid===p.uid&&a.shopId===p.shopId);
if(x)x.qty=Math.min(x.qty+1,Number(p.stock));
else cart.push({...p,qty:1});
cartCount();
say("Cart में जोड़ दिया गया।",true);
}

function cartCount(){
$("cartCount").textContent=cart.reduce((n,x)=>n+x.qty,0)
}

function renderCart(){
$("cartItems").innerHTML=cart.length?
cart.map((p,i)=>'<div class="card"><b>'+esc(p.name)+'</b><br>₹'+p.price+' × '+p.qty+'<br><button class="danger" onclick="removeItem('+i+')">हटाएँ</button></div>').join("")
:"<p>Cart खाली है।</p>";
}

window.removeItem=i=>{
cart.splice(i,1);
cartCount();
renderCart()
};

$("placeOrder").onclick=async()=>{
if(!user){
$("cartModal").classList.add("hidden");
$("authModal").classList.remove("hidden");
return say("Order के लिए Login करें。")
}
if(!cart.length)return say("Cart खाली है।");
try{
const total=cart.reduce((n,p)=>n+Number(p.price)*p.qty,0);
await addDoc(collection(db,"orders"),{
customerId:user.uid,
customerEmail:user.email,
items:cart.map(p=>({
productId:p.id,
name:p.name,
price:Number(p.price),
qty:p.qty,
shopId:p.shopId,
shopName:p.shopName
})),
total,
status:"Pending",
createdAt:serverTimestamp()
});
cart=[];
cartCount();
renderCart();
$("cartModal").classList.add("hidden");
say("Order Firebase में save हो गया।",true);
}catch(e){
say("Order save नहीं हुआ: "+e.message)
}
};

async function shopkeeperLoad(){
$("ownerEmail").textContent=user.email;
const ss=await getDocs(collection(db,"users",user.uid,"shops"));
if(!ss.empty){
const s=ss.docs[0];
shop={id:s.id,...s.data()};
$("shopName").value=shop.name||"";
$("shopAddress").value=shop.address||"";
await myProductsLoad()
}
}

$("saveShop").onclick=async()=>{
if(!user)return;
const name=$("shopName").value.trim(),address=$("shopAddress").value.trim();
if(!name)return say("Shop name डालें।");
const ref=shop?
doc(db,"users",user.uid,"shops",shop.id):
doc(collection(db,"users",user.uid,"shops"));
await setDoc(ref,{
name,
address,
ownerId:user.uid,
updatedAt:serverTimestamp()
},{merge:true});
shop={id:ref.id,name,address};
say("Shop save हो गई।",true);
myProductsLoad();
};

async function myProductsLoad(){
if(!shop)return;
const ps=await getDocs(collection(db,"users",user.uid,"shops",shop.id,"products"));
$("myProducts").innerHTML="";
ps.forEach(s=>{
const p={id:s.id,...s.data()};
const d=document.createElement("div");
d.className="product";
d.innerHTML='<h3>'+esc(p.name)+'</h3><p>₹'+p.price+'/kg • Stock '+p.stock+'</p><button class="danger">Delete</button>';
d.querySelector("button").onclick=async()=>{
await deleteDoc(doc(db,"users",user.uid,"shops",shop.id,"products",p.id));
myProductsLoad()
};
$("myProducts").appendChild(d)
})
}

$("addProduct").onclick=async()=>{
if(!shop)return say("पहले Shop save करें।");
const name=$("pName").value.trim(),price=Number($("pPrice").value),stock=Number($("pStock").value);
if(!name||price<0||stock<0)return say("Product की सही जानकारी डालें।");
await addDoc(
collection(db,"users",user.uid,"shops",shop.id,"products"),
{name,price,stock,createdAt:serverTimestamp()}
);
$("pName").value="";
$("pPrice").value="";
$("pStock").value="";
say("Product add हो गया।",true);
myProductsLoad();
};
