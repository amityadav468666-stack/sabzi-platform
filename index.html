<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SabziGo - Online Sabzi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f4;
      color: #222;
    }

    header {
      background: #16a34a;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 6px 0 0;
    }

    .search {
      padding: 15px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #searchBox {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .shop {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }

    .shop h2 {
      color: #15803d;
      margin-top: 0;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
    }

    .product h3 {
      margin: 0 0 8px;
    }

    .price {
      color: #15803d;
      font-weight: bold;
      font-size: 18px;
    }

    .stock {
      color: #666;
      font-size: 14px;
      margin: 6px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      background: #15803d;
    }

    #cart {
      position: fixed;
      right: 15px;
      bottom: 15px;
      background: #166534;
      color: white;
      padding: 14px 18px;
      border-radius: 30px;
      box-shadow: 0 3px 10px #999;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🥬 SabziGo</h1>
  <p>Fresh Sabzi - Online Shopping</p>
</header>

<div class="search">
  <input
    type="text"
    id="searchBox"
    placeholder="🥕 Sabzi search kare..."
  >
</div>

<div class="container">
  <div id="shops">
    <div class="loading">Sabzi load ho rahi hai...</div>
  </div>
</div>

<div id="cart">
  🛒 Cart: <span id="cartCount">0</span>
</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDBnHhIu-BU10YVrqWaitMTE6ZDArp_xhI",
    authDomain: "sabzigo-2a2dc.firebaseapp.com",
    projectId: "sabzigo-2a2dc",
    storageBucket: "sabzigo-2a2dc.firebasestorage.app",
    messagingSenderId: "395661220461",
    appId: "1:395661220461:web:cacc5b82055eb35cb43d64",
    measurementId: "G-PXR1S16SJC"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  const shopsContainer = document.getElementById("shops");
  const searchBox = document.getElementById("searchBox");
  const cartCount = document.getElementById("cartCount");

  let cart = 0;
  let allProducts = [];


  async function loadProducts() {

    try {

      const usersSnapshot = await getDocs(collection(db, "users"));

      allProducts = [];

      for (const userDoc of usersSnapshot.docs) {

        const shopsSnapshot = await getDocs(
          collection(db, "users", userDoc.id, "shops")
        );

        for (const shopDoc of shopsSnapshot.docs) {

          const shopData = shopDoc.data();

          const productsSnapshot = await getDocs(
            collection(
              db,
              "users",
              userDoc.id,
              "shops",
              shopDoc.id,
              "products"
            )
          );

          for (const productDoc of productsSnapshot.docs) {

            const product = productDoc.data();

            allProducts.push({
              ...product,
              shopName: shopData.shopName || "Sabzi Shop",
              shopId: shopDoc.id
            });

          }
        }
      }

      displayProducts(allProducts);

    } catch (error) {

      console.error(error);

      shopsContainer.innerHTML =
        "<div class='loading'>❌ Sabzi load nahi ho paayi.</div>";
    }
  }


  function displayProducts(products) {

    if (products.length === 0) {

      shopsContainer.innerHTML =
        "<div class='loading'>Abhi koi sabzi available nahi hai.</div>";

      return;
    }


    const shops = {};

    products.forEach(product => {

      if (!shops[product.shopName]) {
        shops[product.shopName] = [];
      }

      shops[product.shopName].push(product);

    });


    shopsContainer.innerHTML = "";


    Object.keys(shops).forEach(shopName => {

      const shopDiv = document.createElement("div");
      shopDiv.className = "shop";

      shopDiv.innerHTML = `
        <h2>🏪 ${shopName}</h2>
        <div class="products"></div>
      `;


      const productsDiv = shopDiv.querySelector(".products");


      shops[shopName].forEach(product => {

        const productDiv = document.createElement("div");
        productDiv.className = "product";

        productDiv.innerHTML = `
          <h3>🥬 ${product.name || "Sabzi"}</h3>
          <div class="price">₹${product.price || 0} / kg</div>
          <div class="stock">
            Stock: ${product.stock || 0}
          </div>
          <button>🛒 Cart me add kare</button>
        `;


        productDiv.querySelector("button").addEventListener(
          "click",
          () => {

            cart++;
            cartCount.textContent = cart;

          }
        );


        productsDiv.appendChild(productDiv);

      });


      shopsContainer.appendChild(shopDiv);

    });

  }


  searchBox.addEventListener("input", () => {

    const text = searchBox.value.toLowerCase().trim();

    const filtered = allProducts.filter(product =>
      String(product.name || "")
        .toLowerCase()
        .includes(text)
    );

    displayProducts(filtered);

  });


  loadProducts();

</script>

</body>
</html>
