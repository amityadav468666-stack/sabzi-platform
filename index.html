  <script type="module">

        // ==============================
            // SabziGo - Firebase Configuration
                // ==============================

                    import { initializeApp } from
                          "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

                              import {
                                    getFirestore,
                                          collection,
                                                getDocs
                                                    } from
                                                          "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


                                                              // Firebase configuration
                                                                  // IMPORTANT:
                                                                      // यहाँ अपने Firebase project की configuration डालनी होगी।

                                                                          const firebaseConfig = {
                                                                                apiKey: "YOUR_API_KEY",
                                                                                      authDomain: "YOUR_PROJECT.firebaseapp.com",
                                                                                            projectId: "YOUR_PROJECT_ID",
                                                                                                  storageBucket: "YOUR_PROJECT.appspot.com",
                                                                                                        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
                                                                                                              appId: "YOUR_APP_ID"
                                                                                                                  };


                                                                                                                      // Firebase start
                                                                                                                          let app;
                                                                                                                              let db;

                                                                                                                                  try {

                                                                                                                                        app = initializeApp(firebaseConfig);

                                                                                                                                              db = getFirestore(app);

                                                                                                                                                    console.log("Firebase connected successfully");

                                                                                                                                                        } catch (error) {

                                                                                                                                                              console.error("Firebase connection error:", error);

                                                                                                                                                                  }


                                                                                                                                                                      // ==============================
                                                                                                                                                                          // Global Variables
                                                                                                                                                                              // ==============================

                                                                                                                                                                                  let cart = 0;

                                                                                                                                                                                      let allProducts = [];

                                                                                                                                                                                          let allShops = {};


                                                                                                                                                                                              const cartCount =
                                                                                                                                                                                                    document.getElementById("cartCount");

                                                                                                                                                                                                        const shopsContainer =
                                                                                                                                                                                                              document.getElementById("shopsContainer");

                                                                                                                                                                                                                  const searchBox =
                                                                                                                                                                                                                        document.getElementById("searchBox");


                                                                                                                                                                                                                            // ==============================
                                                                                                                                                                                                                                // Cart Function
                                                                                                                                                                                                                                    // ==============================

                                                                                                                                                                                                                                        function addToCart(product) {

                                                                                                                                                                                                                                              cart++;

                                                                                                                                                                                                                                                    cartCount.textContent = cart;

                                                                                                                                                                                                                                                          alert(
                                                                                                                                                                                                                                                                  "🛒 " +
                                                                                                                                                                                                                                                                          product.name +
                                                                                                                                                                                                                                                                                  " cart में जोड़ दिया गया।"
                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                // ==============================
                                                                                                                                                                                                                                                                                                    // Product Display Function
                                                                                                                                                                                                                                                                                                        // ==============================

                                                                                                                                                                                                                                                                                                            function displayProducts(products) {

                                                                                                                                                                                                                                                                                                                  shopsContainer.innerHTML = "";

                                                                                                                                                                                                                                                                                                                        if (!products || products.length === 0) {

                                                                                                                                                                                                                                                                                                                                shopsContainer.innerHTML = `
                                                                                                                                                                                                                                                                                                                                          <div class="empty">
                                                                                                                                                                                                                                                                                                                                                      😔 कोई सब्ज़ी नहीं मिली।
                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                        `;

                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                            // Shop wise products
                                                                                                                                                                                                                                                                                                                                                                                                  const shops = {};


                                                                                                                                                                                                                                                                                                                                                                                                        products.forEach(product => {

                                                                                                                                                                                                                                                                                                                                                                                                                const shopName =
                                                                                                                                                                                                                                                                                                                                                                                                                          product.shopName || "Local Shop";


                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!shops[shopName]) {

                                                                                                                                                                                                                                                                                                                                                                                                                                            shops[shopName] = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                            shops[shopName].push(product);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Create shop sections
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Object.keys(shops).forEach(shopName => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const shopDiv =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        shopDiv.className = "shop";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                shopDiv.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h2>🏪 ${shopName}</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="products"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const productsDiv =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              shopDiv.querySelector(".products");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shops[shopName].forEach(product => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const productDiv =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      productDiv.className = "product";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                productDiv.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          🥬 ${product.name || "Vegetable"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="price">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ₹${product.price || 0} / kg
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stock">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Stock: ${product.stock || 0}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            🛒 Cart में जोड़ें
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const button =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        productDiv.querySelector("button");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.addEventListener(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "click",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          () => addToCart(product)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              productsDiv.appendChild(productDiv);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              shopsContainer.appendChild(shopDiv);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // ==============================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Temporary Demo Products
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // ==============================

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const demoProducts = [

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                name: "आलू",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          price: 30,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              shopName: "Amit Vegetable Shop"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        name: "टमाटर",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  price: 40,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            stock: 30,
